const dialog=document.getElementById('lightbox');
document.querySelectorAll('figure img').forEach(img=>{img.addEventListener('click',()=>{dialog.querySelector('img').src=img.src;dialog.querySelector('img').alt=img.alt;dialog.querySelector('p').textContent=img.closest('figure').querySelector('figcaption').textContent;dialog.showModal();});img.tabIndex=0;img.addEventListener('keydown',e=>{if(e.key==='Enter')img.click();});});
